site_name: ABIDES-NG
site_description: Agent-Based Interactive Discrete Event Simulation for financial markets research
site_url: https://gabrieledicorato.github.io/abides-ng/
repo_url: https://github.com/GabrieleDiCorato/abides-ng
repo_name: GabrieleDiCorato/abides-ng
edit_uri: edit/main/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

docs_dir: docs

exclude_docs: |
  active-plans/
  README.md

nav:
  - Home: index.md
  - Getting Started:
    - Quickstart: getting-started/quickstart.md
    - Why ABIDES-NG: project/one-pager.md
  - User Guides:
    - Building a Simulation: reference/config-system.md
    - Writing a Custom Agent: reference/custom-agent-guide.md
    - Extracting Results: reference/data-extraction.md
    - Computing Metrics: reference/metrics-api.md
    - Running Experiments in Parallel: reference/parallel-simulation.md
  - Architecture Reference:
    - Kernel & Lifecycle: reference/kernel-architecture.md
    - Event Bus & Logging: reference/logging-architecture.md
    - Event Vocabulary: reference/event-vocabulary.md
    - Metrics Algorithms: reference/metrics-algorithms.md
  - Operations & Governance:
    - Reproducibility: project/reproducibility.md
    - Release Process: project/release-process.md
  - For LLM / Agent Builders:
    - Integration Gotchas: reference/llm-gotchas.md
  - Changelog: changelog.md

markdown_extensions:
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - tables
  - toc:
      permalink: true

plugins:
  - search
